version: '3.8'

services:
  openmemory-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/openmemory_prod.db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_DB_PATH=/data/chroma_db
    volumes:
      - ./data:/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
