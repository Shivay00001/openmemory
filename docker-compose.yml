version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "3000:3000"
      - "8080:8080"
    environment:\n      - DATABASE_URL=postgresql://user:password@postgres:5432/appdb\n      - REDIS_URL=redis://redis:6379\n

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  mongodata:
  mysqldata:
